[package]
name = "antropy-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 2
