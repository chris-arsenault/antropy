services:
  simulation:
    image: ghcr.io/chris-arsenault/antropy:${IMAGE_TAG:?Set the deployed commit SHA}
    restart: unless-stopped
    init: true
    # One socket's physical cores (NUMA node 0 on the private host; siblings 36-53 excluded).
    # Pinned threads allocate world memory on the same node. Measured scaling flattens well
    # before this width; see SCALING-PLAN.md.
    cpuset: "0-17"
    cpus: 18
    # A 41.5k-cell world held 4.6 GB and peaked at 8.2 GB while saving a ~2 GB raw
    # checkpoint, which the 8 GiB limit killed. Saves hold a full raw copy on top of the world.
    mem_limit: 16g
    pids_limit: 256
    ports:
      - "8095:8095"
    # The server saves the world here on stop, every 30 minutes and on operator request,
    # and resumes the newest same-format checkpoint at launch.
    volumes:
      - biotropy-state:/data
    # Capture plus fast gzip of a ~160 MB checkpoint needs longer than Docker's 10 s default.
    stop_grace_period: 120s
    environment:
      BIOTROPY_STATE_DIR: "/data"
      BIOTROPY_STATE_BYTES: "4294967296"
      BIOTROPY_AUTOSAVE_SECONDS: "1800"
      BIOTROPY_THREADS: "16"
      BIOTROPY_BIND: "0.0.0.0:8095"
      BIOTROPY_SEED: "27"
      BIOTROPY_OPERATOR_TOKEN: "${BIOTROPY_OPERATOR_TOKEN:-}"
      # Public spectators reach /stream through server.biotropy.ahara.io from the static site.
      BIOTROPY_ORIGINS: "https://biotropy.ahara.io"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8095/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  biotropy-state:
