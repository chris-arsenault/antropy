[package]
name = "antropy-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "biotropy-server"
path = "server/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[dependencies]
rayon = "1.11"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }

[features]
threads = ["dep:wasm-bindgen", "dep:wasm-bindgen-rayon"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.108", optional = true }
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 2
